apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: sid-delivery-delay-train-s3-t01
  annotations:
    scenarios.ai.sap.com/name: "sid Supplier Intelligence T01"
    scenarios.ai.sap.com/description: "Sid Supplier delivery delay prediction"
    executables.ai.sap.com/name: "Sid Delivery Delay S3 Training"
    executables.ai.sap.com/description: "Sid Train from CSV and publish model artifact"
    artifacts.ai.sap.com/dataset.kind: "dataset"
    artifacts.ai.sap.com/model.kind: "model"
  labels:
    scenarios.ai.sap.com/id: "sid-supplier-intelligence-t01"
    ai.sap.com/version: "1.1.2"

spec:
  imagePullSecrets:
    - name: gai1126-sid

  entrypoint: train-model

  templates:
    - name: train-model

      metadata:
        labels:
          ai.sap.com/resourcePlan: starter

      inputs:
        artifacts:
          - name: dataset
            path: /app/data/mock_deliveries.csv

      outputs:
        artifacts:
          - name: model
            globalName: model
            path: /app/model
            archive:
              none: {}

      container:
        image: docker.io/raajgk77/faith-delivery-delay:day5-train-v1
        command: ["python", "/app/src/main.py"]
        env:
          - name: DATASET_DIR
            value: /app/data
          - name: MODEL_DIR
            value: /app/model
