apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate

metadata:
  name: sid-delivery-delay-serve-t01
  annotations:
    scenarios.ai.sap.com/name: "SID Supplier Intelligence T01"
    scenarios.ai.sap.com/description: "Sid Supplier delivery delay prediction"
    executables.ai.sap.com/name: "sid-delivery-delay-prediction-api"
    executables.ai.sap.com/description: "Sid Serve the trained delivery delay model"
  labels:
    scenarios.ai.sap.com/id: "sid-supplier-intelligence-t01"
    ai.sap.com/version: "1.2"

spec:
  inputs:
    artifacts:
      - name: model

  template:
    apiVersion: serving.kserve.io/v1beta1

    metadata:
      labels: |
        ai.sap.com/resourcePlan: starter

    spec: |
      predictor:
        imagePullSecrets:
          - name: gai1126-sid

        minReplicas: 1
        maxReplicas: 1

        containers:
          - name: kserve-container
            image: docker.io/raajgk77/faith-delivery-delay:day5-serve-v1

            ports:
              - containerPort: 9001
                protocol: TCP

            env:
              - name: STORAGE_URI
                value: "{{inputs.artifacts.model}}"
              - name: MODEL_DIR
                value: /mnt/models
